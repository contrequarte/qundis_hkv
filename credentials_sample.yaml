user: 'hkv_receiving_email@gmail.com'  #take the address, of the google account, which receives your HKV files.
password: 'app password for google account' #Use an app password, not your "real" password. see: https://support.google.com/mail/answer/185833?hl=en
imap_server: 'imap.gmail.com'  # Google imap server
smtp_server: 'smtp.gmail.com'  # Google smtp server
port: 587 # Google smtp port
csv_to: 'hkv-receiving-account@some.platform.xy' # use the email address, your Provider for 'Subannual Consumption Information' (unterjährige Verbrauchsinformation) has assigned to your account.
csv_bcc: 'somebcc@example.com' # take an address, you want to receive the values as BCC, so the provider won't get this email address.